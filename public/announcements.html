<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Announcements</title>
<style>
  /* Space photo (dark-shaded, same overlay math as .sf-shade in
     style.css) as the very first paint, before style.css/starfield.js
     load — same reasoning as index.html's copy of this rule; see the
     comment there for the full write-up. */
  html {
    background-color: #090c1c;
    background-image:
      linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
      url('/assets/img/bg-space.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* Light-theme override — theme.js (loaded right after this block, and
     synchronous/non-deferred) sets data-theme on <html> before first
     paint, so this genuinely applies from frame one rather than flashing
     in late. The photo is nearly invisible under the light theme's own
     heavy overlay anyway (see --sf-shade's 0.55-0.72 alpha for
     [data-theme="light"] in style.css), so rather than fight CSS filter
     limitations (filter can't be scoped to just a background-image on
     <html> without also filtering all real content once it loads), this
     just reuses the light theme's plain --page-bg gradient values
     directly (kept in sync manually — see :root in style.css if that
     gradient ever changes) with no photo layer at all. Visually
     indistinguishable from the real thing once starfield.js mounts. */
  html[data-theme="light"] {
    background-color: #dbe7fb;
    background-image:
      radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
      linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" /></noscript>
<link rel="stylesheet" href="/assets/style.css?v=0b63d764" />
<script src="/assets/theme.js?v=5b27e630"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=9dba9c0c"></script>
<script src="/assets/presence-heartbeat.js?v=921f46cb"></script>
</head>
<body class="announcements-page">
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">INR CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>
    </div>
  </header>

  <div id="announcementBanner"></div>

  <div class="ann-page-backrow">
    <a href="/" class="back-pill">&larr; Back to Home</a>
  </div>

  <div class="ann-shell" id="annShell">
    <aside class="ann-sidebar">
      <button type="button" class="ann-new-btn" id="annNewBtn">+ New announcement</button>
      <div class="threads-search">
        <span>🔍</span>
        <input type="text" id="annSearch" placeholder="Search topic or message..." autocomplete="off" />
      </div>
      <div id="annList"></div>
    </aside>
    <main class="ann-main">
      <div class="ann-form-card" id="annFormCard">
        <div class="ann-empty-state" id="annEmptyState">Loading…</div>
      </div>
    </main>
  </div>

  <script src="/assets/toast.js?v=67c1e195"></script>
  <script src="/assets/announcement-banner.js?v=4881665d"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");

    const ROLE_RANK = { agent: 0, senior: 1, admin: 2, superadmin: 3, owner: 4 };
    const authInfo = window.AgentAuth.getAuth();
    const myRank = ROLE_RANK[authInfo?.role] ?? ROLE_RANK.agent;

    // Mirrors _shared/accounts.js canAccessOwnerTopic(account,
    // "announcements") — moved out of Account Management Access into the
    // Agent Profile's "Topic access" list, 2026-08-10 (see
    // OWNER_TOPIC_ITEMS in _shared/accounts.js). UI convenience only, the
    // server independently re-checks on every request regardless of
    // this. STRICTLY Owner-granted (ownerTopicAccess) — no "all"
    // shortcut, no rank>=admin blanket bypass. Single tier: having this
    // topic means both viewing and managing announcements (no separate
    // view-only mode anymore).
    const ANN_FLOOR = ROLE_RANK.admin;
    function canSeeAnnouncements() {
      if (!authInfo) return false;
      if (authInfo.role === "owner") return true;
      if (myRank < ANN_FLOOR) return false;
      return Array.isArray(authInfo.ownerTopicAccess) && authInfo.ownerTopicAccess.includes("announcements");
    }

    const canEdit = canSeeAnnouncements();
    let topics = [];
    let announcements = [];
    let selectedId = null; // null while on the blank "new" form
    let isNewDraft = false;
    let pollTimer = null;

    function esc(str) {
      return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function isEffectivelyActive(a, now) {
      if (!a.enabled) return false;
      if (a.startAt && now < new Date(a.startAt).getTime()) return false;
      if (a.endAt && now > new Date(a.endAt).getTime()) return false;
      return true;
    }
    function statusOf(a) {
      const now = Date.now();
      if (!a.enabled) return "inactive";
      if (a.startAt && now < new Date(a.startAt).getTime()) return "scheduled";
      if (a.endAt && now > new Date(a.endAt).getTime()) return "expired";
      return "active";
    }
    const STATUS_LABEL = { active: "Active", inactive: "Inactive", scheduled: "Scheduled", expired: "Expired" };

    function toLocalInputValue(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function fromLocalInputValue(val) {
      if (!val) return null;
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d.toISOString();
    }

    // ---- Sidebar list — the 30s poll ONLY ever touches this function.
    // A separate loadAnnouncements() (below) does the full re-render
    // including the form, and is only ever called right after the
    // agent's own Save/Delete — i.e. only when there's genuinely nothing
    // unsaved to lose. If a poll landing mid-edit called the full-render
    // function instead, it would wipe an in-progress draft.
    function renderList() {
      const q = (document.getElementById("annSearch").value || "").toLowerCase();
      const list = document.getElementById("annList");
      const filtered = announcements.filter((a) =>
        !q || (a.topic || "").toLowerCase().includes(q) || (a.text || "").toLowerCase().includes(q)
      );
      if (!filtered.length) {
        list.innerHTML = '<p class="threads-empty">No announcements yet.</p>';
        return;
      }
      list.innerHTML = filtered.map((a) => {
        const st = statusOf(a);
        const when = a.updatedAt ? new Date(a.updatedAt).toLocaleString() : "";
        return `
          <div class="ann-list-item${a.id === selectedId ? " selected" : ""}" data-id="${esc(a.id)}">
            <div class="ann-list-row">
              <div class="ann-list-topic">${esc(a.topic || "REMINDER")}</div>
              <div class="ann-list-status ${st}"><span class="dot"></span>${STATUS_LABEL[st]}</div>
            </div>
            <div class="ann-list-meta">${esc(a.updatedBy || a.createdBy || "")} · ${esc(when)}</div>
          </div>`;
      }).join("");
      list.querySelectorAll(".ann-list-item").forEach((el) => {
        el.addEventListener("click", () => selectAnnouncement(el.dataset.id));
      });
    }

    function renderForm() {
      const card = document.getElementById("annFormCard");
      const a = isNewDraft ? null : announcements.find((x) => x.id === selectedId);

      if (!canEdit && !a) {
        card.innerHTML = '<div class="ann-empty-state">No announcement selected.</div>';
        return;
      }

      const topicOptions = topics.map((t) => `<option value="${esc(t)}"${a && a.topic === t ? " selected" : ""}>${esc(t)}</option>`).join("");
      const ro = canEdit ? "" : "disabled";
      // Replaces the old Active checkbox — the save button itself doubles
      // as the status toggle, labeled with the state clicking it WILL
      // produce (not the raw `enabled` flag). Keyed off whether the
      // announcement is EFFECTIVELY active right now (isEffectivelyActive
      // — accounts for start/end dates too), not just the raw `enabled`
      // flag, so:
      //   - a brand-new draft (no record yet) is not effectively active
      //     -> button reads "Active" (first save turns it on)
      //   - an Expired announcement still has enabled:true under the
      //     hood (that's what makes it "expired" instead of "inactive" —
      //     see statusOf), but isEffectivelyActive is false for it (past
      //     endAt) -> button reads "Active" (re-enable it), not
      //     "Inactive" (which would be a no-op/confusing on something
      //     that isn't currently showing to anyone anyway)
      //   - a Scheduled announcement (future startAt) is the same case
      //     -> "Active"
      //   - only a currently, effectively Active announcement shows
      //     "Inactive" (click to turn it off)
      // BUG FIXED, 2026-08-10: this used to read `a.enabled` directly
      // (defaulting a brand-new draft to `true`), which showed
      // "Inactive" for a draft that had never been saved yet AND for
      // Expired announcements — backwards in both cases.
      const effectivelyActive = a ? isEffectivelyActive(a, Date.now()) : false;
      const toggleLabel = effectivelyActive ? "Inactive" : "Active";

      card.innerHTML = `
        <div class="ann-form-scroll">
          <div class="form-header"><span class="icon">📢</span><span>${a ? "Edit announcement" : "New announcement"}</span></div>
          <div class="field">
            <label>Topic <span class="required">*</span></label>
            <select id="annTopic" ${ro}>${topicOptions}</select>
          </div>
          <div class="field">
            <label>Message <span class="required">*</span></label>
            <textarea id="annText" rows="8" placeholder="Message shown in the banner" ${ro}>${esc(a ? a.text : "")}</textarea>
          </div>
          <div class="ann-datetime-row">
            <div class="field">
              <label>Start (optional)</label>
              <input type="datetime-local" id="annStart" value="${a ? toLocalInputValue(a.startAt) : ""}" ${ro} />
            </div>
            <div class="field">
              <label>End (optional)</label>
              <input type="datetime-local" id="annEnd" value="${a ? toLocalInputValue(a.endAt) : ""}" ${ro} />
            </div>
          </div>
          <p class="edit-modal-note" id="annNote"></p>
          ${canEdit ? "" : '<p class="edit-modal-note">View only.</p>'}
        </div>
        <div class="ann-form-footer">
          ${canEdit && a ? '<button type="button" class="btn-danger" id="annDeleteBtn">Delete</button>' : ""}
          ${canEdit ? `<button type="button" class="btn-submit" id="annSaveBtn" data-target-enabled="${effectivelyActive ? "false" : "true"}" style="width:auto;padding:9px 18px;">${toggleLabel}</button>` : ""}
        </div>`;

      const saveBtn = document.getElementById("annSaveBtn");
      if (saveBtn) saveBtn.addEventListener("click", saveAnnouncement);
      const delBtn = document.getElementById("annDeleteBtn");
      if (delBtn) delBtn.addEventListener("click", deleteAnnouncement);
    }

    function setNote(msg, type) {
      const el = document.getElementById("annNote");
      // Final result (ok/err) shows via the unified toast popup only —
      // no redundant inline copy of the same text. Transient messages
      // ("Saving…") still show inline since there's no toast for those.
      if (type === "ok" || type === "err") {
        if (el) { el.textContent = ""; el.className = "edit-modal-note"; }
        if (window.showToast) window.showToast(msg, type);
        return;
      }
      if (el) { el.textContent = msg; el.className = "edit-modal-note"; }
    }

    function selectAnnouncement(id) {
      selectedId = id;
      isNewDraft = false;
      renderList();
      renderForm();
    }
    function selectNewDraft() {
      selectedId = null;
      isNewDraft = true;
      renderList();
      renderForm();
    }

    async function saveAnnouncement() {
      const text = document.getElementById("annText").value.trim();
      if (!text) { setNote("Message is required.", "err"); return; }
      const body = {
        action: "save",
        id: isNewDraft ? undefined : selectedId,
        topic: document.getElementById("annTopic").value,
        text,
        enabled: document.getElementById("annSaveBtn").dataset.targetEnabled === "true",
        startAt: fromLocalInputValue(document.getElementById("annStart").value),
        endAt: fromLocalInputValue(document.getElementById("annEnd").value),
      };
      setNote("Saving…");
      const res = await window.AgentAuth.authFetch("/api/admin/announcements", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const data = await res.json();
      // The Save button IS the Active/Inactive toggle (see toggleLabel in
      // renderForm) — its real effect each click is "set enabled to
      // true/false", so the result wording follows that, not a generic
      // "Save", matching the Active/Inactive convention used everywhere
      // else a control's whole job is flipping an enabled state.
      if (!data.ok) { setNote(data.error || (body.enabled ? "Active failed." : "Inactive failed."), "err"); return; }
      setNote(body.enabled ? "Active success." : "Inactive success.", "ok");
      if (window.refreshAnnouncementBanner) window.refreshAnnouncementBanner();
      await loadAnnouncements();
      selectAnnouncement(data.announcement.id);
    }

    async function deleteAnnouncement() {
      if (!selectedId) return;
      if (!confirm("Delete this announcement?")) return;
      const res = await window.AgentAuth.authFetch("/api/admin/announcements", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "delete", id: selectedId }),
      });
      const data = await res.json();
      if (!data.ok) { setNote(data.error || "Delete failed.", "err"); return; }
      setNote("Delete success.", "ok");
      if (window.refreshAnnouncementBanner) window.refreshAnnouncementBanner();
      await loadAnnouncements();
      if (announcements.length) selectAnnouncement(announcements[0].id);
      else selectNewDraft();
    }

    // Full re-render, including the form — only call this right after
    // the agent's own Save/Delete, never from the background poll.
    async function loadAnnouncements() {
      const res = await window.AgentAuth.authFetch("/api/admin/announcements");
      const data = await res.json();
      if (!data.ok) {
        document.getElementById("annFormCard").innerHTML = `<div class="ann-empty-state">${esc(data.error || "Failed to load.")}</div>`;
        return;
      }
      topics = data.topics || [];
      announcements = data.announcements || [];
      if (canEdit) {
        if (!selectedId && !isNewDraft) selectNewDraft();
        else { renderList(); renderForm(); }
      } else {
        if (announcements.length) selectAnnouncement(announcements[0].id);
        else { renderList(); renderForm(); }
      }
    }

    // Poll — sidebar list only, never touches the form (see renderList()
    // doc comment above).
    async function pollAnnouncements() {
      try {
        const res = await window.AgentAuth.authFetch("/api/admin/announcements");
        const data = await res.json();
        if (!data.ok) return;
        topics = data.topics || topics;
        announcements = data.announcements || [];
        renderList();
      } catch {}
    }

    document.getElementById("annNewBtn").addEventListener("click", selectNewDraft);
    document.getElementById("annSearch").addEventListener("input", renderList);

    if (!canSeeAnnouncements()) {
      document.getElementById("annFormCard").innerHTML = '<div class="ann-empty-state">You don\'t have access to Announcements.</div>';
      document.getElementById("annList").innerHTML = "";
    } else {
      loadAnnouncements();
      pollTimer = setInterval(pollAnnouncements, 30000);
    }
  </script>
</body>
</html>
