<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Issue Submission</title>
<style>
  /* Space photo as the very first paint, before style.css/starfield.js
     load — same reasoning (and same photo, so no flat-color-then-photo
     jump once starfield.js mounts) as index.html's copy of this rule;
     see the comment there for the full write-up. */
  html {
    background-color: #090c1c;
    background-image:
      linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
      url('/assets/img/bg-space.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* Light-theme override — theme.js (loaded right after this block, and
     synchronous/non-deferred) sets data-theme on <html> before first
     paint, so this genuinely applies from frame one rather than flashing
     in late. The photo is nearly invisible under the light theme's own
     heavy overlay anyway (see --sf-shade's 0.55-0.72 alpha for
     [data-theme="light"] in style.css), so rather than fight CSS filter
     limitations (filter can't be scoped to just a background-image on
     <html> without also filtering all real content once it loads), this
     just reuses the light theme's plain --page-bg gradient values
     directly (kept in sync manually — see :root in style.css if that
     gradient ever changes) with no photo layer at all. Visually
     indistinguishable from the real thing once starfield.js mounts. */
  html[data-theme="light"] {
    background-color: #dbe7fb;
    background-image:
      radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
      linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body class="page-transition-in">
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">INR CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>
    </div>
  </header>

  <div id="announcementBanner"></div>

  <a href="/" class="back-pill">&larr; Back to Home</a>
  <script>window.wireFadeLinks(".back-pill");</script>

  <div class="form-page">
    <div class="form-card">
      <div class="form-header"><span class="icon" id="formIcon"></span><span id="formTitle">Loading…</span></div>
      <p class="form-hint" id="formHint"></p>
      <hr class="form-divider" />

      <form id="issueForm">
        <div class="field">
          <label>Brand / Platform <span class="required">*</span></label>
          <select name="brand" required></select>
        </div>

        <div id="dynamicFields"></div>

        <div class="field">
          <span class="attach-label" id="attachLabel">Supporting Screenshots</span>
          <div class="dropzone" id="dropzone" tabindex="0">
            <div class="dz-icon">📎</div>
            <p class="dz-main">Click or drag files here</p>
            <p class="dz-sub" id="dzSub">JPG, PNG, PDF — Max 3 files</p>
            <p class="dz-paste">📋 Ctrl+V / ⌘V to paste screenshot</p>
          </div>
          <div class="file-list" id="fileList"></div>
          <input type="file" id="fileInput" multiple hidden />
        </div>

        <div class="field">
          <label><span id="reporterLabelText">Agent Name</span> <span class="required">*</span></label>
          <input type="text" name="reporter" required placeholder="Your agent name..." autocomplete="off" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit" id="submitBtn">
            <span>📨</span><span id="submitLabel">Submit</span>
          </button>
          <span id="statusMsg" class="status-msg"></span>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/schemas.js?v=b5c55f4a"></script>
  <script src="/assets/app.js?v=f155273a"></script>
  <script src="/assets/toast.js?v=67c1e195"></script>
  <script src="/assets/announcement-banner.js?v=4881665d"></script>
</body>
</html>
