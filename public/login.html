<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log In — INR CS Team</title>
<style>
  /* Space photo (dark-shaded, same overlay math as .sf-shade in
     style.css) as the very first paint, before style.css/starfield.js
     load — same reasoning as index.html's copy of this rule; see the
     comment there for the full write-up. */
  html {
    background-color: #090c1c;
    background-image:
      linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
      url('/assets/img/bg-space.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* Light-theme override — theme.js (loaded right after this block, and
     synchronous/non-deferred) sets data-theme on <html> before first
     paint, so this genuinely applies from frame one rather than flashing
     in late. The photo is nearly invisible under the light theme's own
     heavy overlay anyway (see --sf-shade's 0.55-0.72 alpha for
     [data-theme="light"] in style.css), so rather than fight CSS filter
     limitations (filter can't be scoped to just a background-image on
     <html> without also filtering all real content once it loads), this
     just reuses the light theme's plain --page-bg gradient values
     directly (kept in sync manually — see :root in style.css if that
     gradient ever changes) with no photo layer at all. Visually
     indistinguishable from the real thing once starfield.js mounts. */
  html[data-theme="light"] {
    background-color: #dbe7fb;
    background-image:
      radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
      linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" /></noscript>
<link rel="stylesheet" href="/assets/style.css?v=85731f55" />
<script src="/assets/theme.js?v=5b27e630"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">INR CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
    </div>
  </header>

  <div class="login-page-wrap">
    <div class="form-card" style="max-width:380px;">
      <div class="form-header"><span class="icon">🔒</span><span>Agent Login</span></div>
      <p class="form-hint">Log in to access the INR CS Team hub.</p>
      <hr class="form-divider" />
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUsername" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" />
      </div>
      <div id="loginError" class="field-note err" style="display:none;"></div>
      <div class="form-actions">
        <button class="btn-submit" id="loginBtn"><span>🔓</span><span>Log In</span></button>
      </div>
    </div>
  </div>

  <script>
    window.initThemeToggle();
    window.initClock();

    const params = new URLSearchParams(location.search);
    const redirectTo = params.get("redirect") || "/";

    // If already logged in (e.g. someone bookmarked /login.html), just go
    // straight through instead of showing the form again.
    (function skipIfAlreadyLoggedIn() {
      try {
        const auth = JSON.parse(localStorage.getItem("agentAuth") || "null");
        if (auth) location.href = redirectTo;
      } catch { /* ignore malformed localStorage, just show the form */ }
    })();

    async function attemptLogin() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      if (!username || !password) {
        err.textContent = "Enter both a username and password.";
        err.style.display = "block";
        return;
      }
      btn.disabled = true;
      err.style.display = "none";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!data.ok) {
          err.textContent = data.error || "Login failed.";
          err.style.display = "block";
          return;
        }
        localStorage.setItem("agentAuth", JSON.stringify({
          username: data.account.username, token: data.token, role: data.account.role, allowedBrands: data.account.allowedBrands, allowedModules: data.account.allowedModules,
          allowedAdminSections: data.account.allowedAdminSections, adminSectionEditAccess: data.account.adminSectionEditAccess, canGrantAdminAccess: data.account.canGrantAdminAccess,
        }));
        localStorage.setItem("agentLastActivity", String(Date.now()));
        location.href = redirectTo;
      } catch {
        err.textContent = "Network error — try again.";
        err.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("loginBtn").addEventListener("click", attemptLogin);
    document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
  </script>
</body>
</html>
