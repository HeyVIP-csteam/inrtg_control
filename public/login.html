<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log In — PKR CS Team</title>
<script src="/assets/theme.js?v=c61fb537"></script>
<style>
/* Inline placeholder canvas background — first thing the browser parses
   in <head>, so it paints before any network request (external CSS, the
   photo itself) resolves. Values are hard-coded here (can't use var()
   yet — style.css may not have loaded) but are kept in exact sync with
   the "real" html{}/html[data-theme=light]{} rule in style.css, so the
   moment that stylesheet finishes loading there is zero visible change.
   Must stay inline and first — an external <link> here would leave a
   blank gap for a network round trip before anything paints. Only sets
   background on <html>, never <body>: <body> has its own
   theme-toggle transition, and animating from this photo to some other
   background would try to interpolate image -> gradient, which browsers
   can't do and would just look like a broken flash. */
html {
  background-color: #090c1c;
  background-image:
    linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
    url('/assets/img/bg-space.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
html[data-theme="light"] {
  background-color: #dbe7fb;
  background-image:
    radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
    linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
}
</style>
<link rel="stylesheet" href="/assets/style.css?v=467b5a4c" />
<link rel="stylesheet" href="/assets/toast.css?v=5779b14e" />
<script src="/assets/toast.js?v=d9d84724"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">PKR CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
    </div>
  </header>

  <div class="login-page-wrap">
    <div class="form-card" style="max-width:380px;">
      <div class="form-header"><span class="icon">🔒</span><span>Agent Login</span></div>
      <p class="form-hint">Log in to access the PKR CS Team hub.</p>
      <hr class="form-divider" />
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUsername" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" />
      </div>
      <div id="loginError" class="field-note err" style="display:none;"></div>
      <div class="form-actions">
        <button class="btn-submit" id="loginBtn"><span>🔓</span><span>Log In</span></button>
      </div>
    </div>
  </div>

  <script>
    window.initThemeToggle();
    window.initClock();

    const params = new URLSearchParams(location.search);
    const redirectTo = params.get("redirect") || "/";

    // If already logged in (e.g. someone bookmarked /login.html), just go
    // straight through instead of showing the form again.
    (function skipIfAlreadyLoggedIn() {
      try {
        const auth = JSON.parse(localStorage.getItem("agentAuth") || "null");
        if (auth) location.href = redirectTo;
      } catch { /* ignore malformed localStorage, just show the form */ }
    })();

    async function attemptLogin() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      if (!username || !password) {
        err.textContent = "Enter both a username and password.";
        err.style.display = "block";
        return;
      }
      btn.disabled = true;
      err.style.display = "none";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!data.ok) {
          err.textContent = data.error || "Login failed.";
          err.style.display = "block";
          return;
        }
        localStorage.setItem("agentAuth", JSON.stringify({
          username: data.account.username, token: data.token, role: data.account.role, allowedBrands: data.account.allowedBrands, allowedModules: data.account.allowedModules,
          allowedAdminSections: data.account.allowedAdminSections, adminSectionEditAccess: data.account.adminSectionEditAccess, canManageAdminAccess: data.account.canManageAdminAccess,
          canViewActiveAgents: data.account.canViewActiveAgents,
        }));
        localStorage.setItem("agentLastActivity", String(Date.now()));
        location.href = redirectTo;
      } catch {
        err.textContent = "Network error — try again.";
        err.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("loginBtn").addEventListener("click", attemptLogin);
    document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
  </script>
</body>
</html>
