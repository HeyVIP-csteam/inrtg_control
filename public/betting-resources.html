<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HeyVIP Betting Rules</title>
<style>
  /* Space photo (dark-shaded, same overlay math as .sf-shade in
     style.css) as the very first paint, before style.css/starfield.js
     load — see index.html for the full write-up of why this exists. */
  html {
    background-color: #090c1c;
    background-image:
      linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
      url('/assets/img/bg-space.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  html[data-theme="light"] {
    background-color: #dbe7fb;
    background-image:
      radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
      linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" /></noscript>
<link rel="stylesheet" href="/assets/style.css?v=4102c368" />
<script src="/assets/theme.js?v=5b27e630"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=9dba9c0c"></script>
<script src="/assets/presence-heartbeat.js?v=921f46cb"></script>
<style>
  .br-shell { max-width: 1100px; margin: 0 auto; padding: 20px 24px 80px; }

  .br-header-card {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 22px; margin-bottom: 16px;
  }
  .br-header-card .header-icon { font-size: 20px; line-height: 1; margin-top: -1px; flex-shrink: 0; }
  .br-header-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); }
  .br-header-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .br-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; align-items: start; }
  @media (max-width: 720px) { .br-grid { grid-template-columns: 1fr; } }

  .br-panel {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 18px 20px;
  }
  .br-panel-title {
    font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink);
    margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .br-link-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--field-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
    text-decoration: none; color: var(--ink); font-weight: 600; font-size: 13.5px;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .br-link-row:last-child { margin-bottom: 0; }
  .br-link-row:hover { border-color: var(--accent-gold); transform: translateX(2px); }
  .br-link-row .go { margin-left: auto; color: var(--ink-soft); font-size: 13px; flex-shrink: 0; }
  .br-link-row:hover .go { color: var(--accent-gold); }
  .br-empty { font-size: 12.5px; color: var(--ink-soft); }
</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">CS TEAM</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>
    </div>
  </header>

  <div id="announcementBanner"></div>

  <div class="threads-topline">
    <a href="/" class="back-pill">&larr; Back to Home</a>
  </div>

  <div class="br-shell">
    <div class="br-header-card">
      <span class="header-icon">📋</span>
      <div>
        <div class="br-header-title">HeyVIP Betting Rules</div>
        <div class="br-header-sub">Betting platforms & results finding websites</div>
      </div>
    </div>

    <div class="br-grid">
      <div class="br-panel">
        <div class="br-panel-title">HeyVIP Betting Resources</div>
        <div id="brRulesPanel"><p class="br-empty">Loading…</p></div>
      </div>
      <div class="br-panel">
        <div class="br-panel-title">Results Finding Websites</div>
        <div id="brResultsPanel"><p class="br-empty">Loading…</p></div>
      </div>
    </div>
  </div>

  <script src="/assets/toast.js?v=67c1e195"></script>
  <script src="/assets/announcement-banner.js?v=4881665d"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");

    function esc(str) {
      return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function load() {
      const res = await window.AgentAuth.authFetch("/api/betting-resources");
      const data = await res.json();
      const rulesPanel = document.getElementById("brRulesPanel");
      const resultsPanel = document.getElementById("brResultsPanel");
      if (!data.ok) {
        rulesPanel.innerHTML = `<p class="br-empty">${esc(data.error || "Failed to load.")}</p>`;
        resultsPanel.innerHTML = "";
        return;
      }

      const rules = data.data.rules;
      rulesPanel.innerHTML = (rules && rules.url)
        ? `<a class="br-link-row" href="${esc(rules.url)}" target="_blank" rel="noopener">${esc(rules.icon || "📄")} ${esc(rules.name || rules.url)}<span class="go">↗</span></a>`
        : `<p class="br-empty">No link set yet.</p>`;

      const results = Array.isArray(data.data.results) ? data.data.results : [];
      resultsPanel.innerHTML = results.length
        ? results.map((l) => `<a class="br-link-row" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.icon || "🔗")} ${esc(l.name || l.url)}<span class="go">↗</span></a>`).join("")
        : `<p class="br-empty">No links set yet.</p>`;
    }

    load();
  </script>

</body>
</html>
