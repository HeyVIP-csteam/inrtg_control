<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity Logs</title>
<style>
  /* Space photo (dark-shaded, same overlay math as .sf-shade in
     style.css) as the very first paint, before style.css/starfield.js
     load — same reasoning as index.html's/promo.html's copy of this
     rule; see the comment there for the full write-up. */
  html {
    background-color: #090c1c;
    background-image:
      linear-gradient(180deg, rgba(3,4,13,0.35) 0%, rgba(3,4,13,0.55) 55%, rgba(3,4,13,0.75) 100%),
      url('/assets/img/bg-space.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  html[data-theme="light"] {
    background-color: #dbe7fb;
    background-image:
      radial-gradient(900px 500px at 90% 0%, #eaf1ff 0%, transparent 55%),
      linear-gradient(160deg, #dbe7fb 0%, #d9cef4 45%, #cdbdf2 75%, #c4b2ee 100%);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" /></noscript>
<link rel="stylesheet" href="/assets/style.css?v=4eec5090" />
<script src="/assets/theme.js?v=5b27e630"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=9dba9c0c"></script>
<script src="/assets/presence-heartbeat.js?v=921f46cb"></script>
<style>
  .actlog-shell { max-width: 1800px; width: 100%; margin: 0 auto; padding: 0 24px 80px; }

  /* ---- Title card ---- */
  .actlog-header-card {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 22px; margin-bottom: 16px;
  }
  .actlog-header-left { display: flex; align-items: flex-start; gap: 10px; }
  .actlog-header-left .header-icon { font-size: 20px; line-height: 1; margin-top: -1px; flex-shrink: 0; }
  .actlog-header-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); }
  .actlog-header-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  /* ---- Filter card (single row, no wrap) ---- */
  .actlog-filter-card {
    display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 16px; margin-bottom: 16px; overflow-x: auto;
  }
  .actlog-filter-card select,
  .actlog-filter-card input[type="text"] {
    background: var(--field-bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--ink); font-size: 13px; padding: 8px 12px; font-family: inherit;
  }
  .actlog-filter-card select { flex: 0 0 auto; min-width: 150px; }
  .actlog-filter-card input[data-actlog-agent] { flex: 0 0 auto; width: 160px; }
  .actlog-filter-card input[data-actlog-search] { flex: 1 1 220px; min-width: 160px; }
  .actlog-filter-card select:focus,
  .actlog-filter-card input:focus { outline: none; border-color: var(--accent-gold); }
  .actlog-filter-count {
    flex: 0 0 auto; font-size: 12px; color: var(--ink-soft); white-space: nowrap;
    background: var(--field-bg); border: 1px solid var(--pill-border); border-radius: 20px;
    padding: 5px 12px;
  }

  /* ---- Results card ---- */
  .actlog-results-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 22px;
  }
  .actlog-results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .actlog-results-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .actlog-results-title .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .actlog-results-right { display: flex; align-items: center; gap: 10px; }

  .actlog-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
  .actlog-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .actlog-table th, .actlog-table td { padding: 10px 12px; white-space: nowrap; vertical-align: top; }
  .actlog-table th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-soft); font-weight: 700; background: var(--field-bg);
    position: sticky; top: 0;
  }
  .actlog-table td { color: var(--ink); border-top: 1px solid var(--border); }
  .actlog-table tr:first-child td { border-top: none; }
  /* Column divider lines — not on the last column (IP), same reasoning
     as the IP Access panel's .ipa-row divider rule: a border right
     before a right-aligned/trailing column just crowds it. */
  .actlog-table th:not(:last-child),
  .actlog-table td:not(:last-child) { border-right: 1px solid var(--border); }
  @media (max-width: 720px) {
    .actlog-table th:not(:last-child),
    .actlog-table td:not(:last-child) { border-right: none; }
  }
  /* Detail column: only one that wraps / eats remaining width — see the
     project-wide "don't use table-layout:fixed + % widths" note. */
  .actlog-table th.actlog-col-detail,
  .actlog-table td.actlog-col-detail { width: 100%; white-space: normal; word-break: break-word; }

  .actlog-agent { font-weight: 600; }
  .actlog-ip { font-family: var(--font-mono); color: var(--ink-soft); }

  .actlog-detail {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer; max-width: 640px;
  }
  .actlog-detail.is-expanded { display: block; -webkit-line-clamp: unset; max-width: none; }
  tr[data-detail-row]:hover { background: rgba(127,127,127,0.05); }

  #actlogEmpty { min-height: 160px; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 12.5px; }

  @media (max-width: 720px) {
    .actlog-filter-card { flex-wrap: wrap; }
    .actlog-filter-card input[data-actlog-search] { flex: 1 1 100%; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">INR CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>
    </div>
  </header>

  <div id="announcementBanner"></div>

  <div class="threads-topline">
    <a href="/" class="back-pill">&larr; Back to Home</a>
  </div>

  <div class="actlog-shell">
    <div class="actlog-header-card">
      <div class="actlog-header-left">
        <span class="header-icon">🔎</span>
        <div>
          <div class="actlog-header-title">Activity Logs</div>
          <div class="actlog-header-sub">Who did what, when, and from where — kept for 90 days.</div>
        </div>
      </div>
      <button class="icon-btn icon-btn-labeled" id="actlogRefreshBtn" title="Refresh"><span class="icon-btn-glyph">↻</span> <span>Refresh</span></button>
    </div>

    <div class="actlog-filter-card">
      <select id="actlogCategory" data-actlog-category>
        <option value="">All categories</option>
        <option value="Auth">🔐 Auth</option>
        <option value="Account">👤 Account</option>
        <option value="Thread">🎫 Thread</option>
        <option value="Config">⚙️ Config</option>
      </select>
      <input type="text" id="actlogAgent" data-actlog-agent placeholder="Filter by agent" autocomplete="off" />
      <input type="text" id="actlogSearch" data-actlog-search placeholder="Search action or detail…" autocomplete="off" />
      <span class="actlog-filter-count" id="actlogFilterCount">0 of 0</span>
    </div>

    <div class="actlog-results-card">
      <div class="actlog-results-head">
        <div class="actlog-results-title"><span class="status-dot"></span> Recent activity</div>
        <div class="actlog-results-right">
          <label class="ipa-page-size" style="display:none;" id="actlogPageSizeWrap">
            <select id="actlogPageSize">
              <option value="10" selected>10/page</option>
              <option value="20">20/page</option>
              <option value="30">30/page</option>
            </select>
          </label>
          <span class="actlog-filter-count" id="actlogFoundPill">0 found</span>
        </div>
      </div>

      <div id="actlogEmpty" style="display:none;">No activity recorded yet.</div>

      <div class="actlog-table-wrap" id="actlogTableWrap">
        <table class="actlog-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Agent</th>
              <th>Action</th>
              <th class="actlog-col-detail">Detail</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody id="actlogTbody"></tbody>
        </table>
      </div>

      <div class="ipa-pagination" id="actlogPagination" style="display:none;"></div>
    </div>
  </div>

  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");

    (function () {
      let allEntries = [];
      let actlogPage = 1;
      let actlogPageSize = 10;

      const categorySelect = document.getElementById("actlogCategory");
      const agentInput = document.getElementById("actlogAgent");
      const searchInput = document.getElementById("actlogSearch");
      const filterCount = document.getElementById("actlogFilterCount");
      const foundPill = document.getElementById("actlogFoundPill");
      const pageSizeWrap = document.getElementById("actlogPageSizeWrap");
      const pageSizeSelect = document.getElementById("actlogPageSize");
      const tbody = document.getElementById("actlogTbody");
      const tableWrap = document.getElementById("actlogTableWrap");
      const emptyEl = document.getElementById("actlogEmpty");
      const paginationEl = document.getElementById("actlogPagination");
      const refreshBtn = document.getElementById("actlogRefreshBtn");

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function debounce(fn, ms) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
      }

      function fmtDate(ts) {
        const d = new Date(ts);
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" });
      }
      function fmtTime(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      function getFiltered() {
        const cat = categorySelect.value;
        const agentQ = agentInput.value.trim().toLowerCase();
        const searchQ = searchInput.value.trim().toLowerCase();
        return allEntries.filter((e) => {
          if (cat && e.category !== cat) return false;
          if (agentQ && !(e.agent || "").toLowerCase().includes(agentQ)) return false;
          if (searchQ) {
            const hay = `${e.action || ""} ${e.detail || ""}`.toLowerCase();
            if (!hay.includes(searchQ)) return false;
          }
          return true;
        });
      }

      function render() {
        const filtered = getFiltered();
        filterCount.textContent = `${filtered.length} of ${allEntries.length}`;
        foundPill.textContent = `${filtered.length} found`;
        pageSizeWrap.style.display = filtered.length ? "" : "none";

        const totalPages = Math.max(1, Math.ceil(filtered.length / actlogPageSize));
        if (actlogPage > totalPages) actlogPage = totalPages;
        const start = (actlogPage - 1) * actlogPageSize;
        const pageEntries = filtered.slice(start, start + actlogPageSize);

        if (!pageEntries.length) {
          tableWrap.style.display = "none";
          emptyEl.style.display = "flex";
          emptyEl.textContent = allEntries.length ? "No activity matches these filters." : "No activity recorded yet.";
        } else {
          tableWrap.style.display = "";
          emptyEl.style.display = "none";
          tbody.innerHTML = pageEntries.map((e, i) => {
            return `
              <tr data-detail-row data-idx="${start + i}">
                <td>${fmtDate(e.ts)}</td>
                <td>${fmtTime(e.ts)}</td>
                <td class="actlog-agent">${escapeHtml(e.agent)}</td>
                <td>${escapeHtml(e.action)}</td>
                <td class="actlog-col-detail"><div class="actlog-detail">${escapeHtml(e.detail)}</div></td>
                <td class="actlog-ip">${escapeHtml(e.ip)}</td>
              </tr>`;
          }).join("");
        }

        if (filtered.length > actlogPageSize) {
          paginationEl.style.display = "flex";
          paginationEl.innerHTML = `
            <button type="button" class="row-btn" data-dir="prev" ${actlogPage <= 1 ? "disabled" : ""}>Previous</button>
            <span class="ipa-page-indicator">Page ${actlogPage} / ${totalPages}</span>
            <button type="button" class="row-btn" data-dir="next" ${actlogPage >= totalPages ? "disabled" : ""}>Next</button>`;
        } else {
          paginationEl.style.display = "none";
        }
      }

      tbody.addEventListener("click", (e) => {
        const row = e.target.closest("tr[data-detail-row]");
        if (!row) return;
        row.querySelector(".actlog-detail")?.classList.toggle("is-expanded");
      });

      categorySelect.addEventListener("change", () => { actlogPage = 1; render(); });
      agentInput.addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
      searchInput.addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
      pageSizeSelect.addEventListener("change", (e) => {
        actlogPageSize = Number(e.target.value);
        actlogPage = 1;
        render();
      });
      paginationEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-dir]");
        if (!btn || btn.disabled) return;
        actlogPage += btn.dataset.dir === "next" ? 1 : -1;
        render();
      });

      async function load() {
        if (refreshBtn.disabled) return; // guard against rapid double-clicks
        refreshBtn.classList.add("spinning");
        refreshBtn.disabled = true;
        const startedAt = Date.now();
        const MIN_VISIBLE_MS = 600;
        try {
          const res = await window.AgentAuth.authFetch("/api/admin/activity-logs");
          const data = await res.json();
          if (data.ok) {
            allEntries = data.entries || [];
            render();
          } else {
            tableWrap.style.display = "none";
            emptyEl.style.display = "flex";
            emptyEl.textContent = data.error || "Failed to load activity logs.";
          }
        } catch {
          tableWrap.style.display = "none";
          emptyEl.style.display = "flex";
          emptyEl.textContent = "Failed to load activity logs.";
        } finally {
          const elapsed = Date.now() - startedAt;
          if (elapsed < MIN_VISIBLE_MS) await new Promise((r) => setTimeout(r, MIN_VISIBLE_MS - elapsed));
          refreshBtn.classList.remove("spinning");
          refreshBtn.disabled = false;
        }
      }

      refreshBtn.addEventListener("click", load);
      load();
    })();
  </script>
</body>
</html>
