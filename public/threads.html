                <p class="dz-paste">📋 Ctrl+V / ⌘V to paste screenshot</p>
              </div>
              <div class="file-list" id="fwdFileList"></div>
              <input type="file" id="fwdNewFile" multiple hidden />
            </div>
          </div>
          <div class="edit-details-status" id="forwardStatus"></div>
          <div class="edit-details-actions">
            <button type="button" class="icon-btn" id="forwardCancel" style="width:auto; height:auto; padding:14px 22px; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center;">Cancel</button>
            <button type="button" class="btn-submit" id="forwardSubmit" style="width:auto; padding:14px 22px;">Generate &amp; Send</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const fieldsContainer = overlay.querySelector("#fwdFieldsContainer");
      let targetModule = null;
      let fieldEls = {};
      let newFiles = []; // File objects — same shape app.js's own dropzone builds

      function renderFileList() {
        const fileListEl = overlay.querySelector("#fwdFileList");
        fileListEl.innerHTML = newFiles
          .map((f, i) => `<div class="file-chip"><span class="name">${escapeHtml(f.name)}</span><button type="button" data-i="${i}">&times;</button></div>`)
          .join("");
        fileListEl.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => { newFiles.splice(Number(btn.dataset.i), 1); renderFileList(); });
        });
      }
      function addFiles(list) {
        const statusEl = overlay.querySelector("#forwardStatus");
        const rejected = [];
        for (const f of list) {
          if (newFiles.length >= 3) break;
          if (f.size > 20 * 1024 * 1024) { rejected.push(f.name); continue; }
          newFiles.push(f);
        }
        renderFileList();
        if (rejected.length) {
          statusEl.textContent = `Skipped (over 20MB): ${rejected.join(", ")}`;
          statusEl.className = "edit-details-status err";
        }
      }
      const dropzone = overlay.querySelector("#fwdDropzone");
      const fileInput = overlay.querySelector("#fwdNewFile");
      dropzone.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
      fileInput.addEventListener("change", () => addFiles(fileInput.files));
      ["dragenter", "dragover"].forEach((evt) => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag-over"); }));
      ["dragleave", "drop"].forEach((evt) => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag-over"); }));
      dropzone.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
      // Scoped to while THIS modal is open, unlike app.js's own paste
      // listener (which lives on the submission form page for its whole
      // lifetime) — threads.html stays open indefinitely as agents work
      // through tickets, so a paste listener added here has to be
      // explicitly removed on close (see close() below), or every future
      // paste anywhere on the page — including into the reply box —
      // would also get treated as "add an attachment to a forward that
      // isn't even open anymore".
      function pasteHandler(e) {
        const items = Array.from(e.clipboardData.items).filter((i) => i.kind === "file");
        if (!items.length) return;
        addFiles(items.map((i) => i.getAsFile()).filter(Boolean));
      }
      window.addEventListener("paste", pasteHandler);

      function conditionMet(showIf) {
        const conditions = Array.isArray(showIf) ? showIf : [showIf];
        return conditions.every((c) => {
          if (c.field === "brand") return c.oneOf.includes(source.brandId);
          const driver = fieldEls[c.field];
          return driver && c.oneOf.includes(driver.control.value);
        });
      }
      function refreshVisibility() {
        targetModule.fields.forEach((f) => {
          if (!f.showIf) return;
          fieldEls[f.key].wrap.style.display = conditionMet(f.showIf) ? "" : "none";
        });
      }

      overlay.querySelector("#fwdModule").addEventListener("change", (e) => {
        const moduleId = e.target.value;
        targetModule = otherModules.find((m) => m.id === moduleId) || null;
        fieldsContainer.innerHTML = "";
        fieldEls = {};
        overlay.querySelector("#fwdAttachField").style.display = targetModule ? "" : "none";
        if (!targetModule) return;

        targetModule.fields.forEach((f) => {
          const wrap = document.createElement("div");
          wrap.className = "field";
          // Pre-fill wherever the SOURCE ticket happens to have a
          // same-named field (UID/Number/Email etc.) — left blank
          // otherwise (most commonly Issue Type, which almost never has
          // an equivalent on the source side). Always editable either
          // way — this is a starting point, not a guarantee it's right
          // for the new Topic.
          const value = sourceFieldMap[f.key] != null ? sourceFieldMap[f.key] : "";
          let controlHtml;
          if (f.type === "textarea") {
            controlHtml = `<textarea name="${escapeAttr(f.key)}">${escapeHtml(value)}</textarea>`;
          } else if (f.type === "select") {
            const rawOpts = f.optionsByBrand ? (f.optionsByBrand[source.brandId] || []) : (f.options || []);
            const opts = rawOpts.map((o) => (typeof o === "object" ? o.value : o));
            controlHtml = `<select name="${escapeAttr(f.key)}">
              <option value="">— Select —</option>
              ${opts.map((o) => `<option value="${escapeAttr(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
            </select>`;
          } else {
            const inputType = f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
            controlHtml = `<input type="${inputType}" name="${escapeAttr(f.key)}" value="${escapeAttr(value)}" />`;
          }
          wrap.innerHTML = `<label>${escapeHtml(f.label)}${f.required ? ' <span class="required">*</span>' : ""}</label>${controlHtml}`;
          fieldsContainer.appendChild(wrap);
          fieldEls[f.key] = { wrap, control: wrap.querySelector("input,select,textarea") };
        });
        targetModule.fields.forEach((f) => {
          if (fieldEls[f.key].control.tagName === "SELECT") {
            fieldEls[f.key].control.addEventListener("change", refreshVisibility);
          }
        });
        refreshVisibility();
      });

      function close() {
        window.removeEventListener("paste", pasteHandler);
        overlay.remove();
      }
      overlay.querySelector("#forwardClose").addEventListener("click", close);
      overlay.querySelector("#forwardCancel").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

      overlay.querySelector("#forwardSubmit").addEventListener("click", async () => {
        const statusEl = overlay.querySelector("#forwardStatus");
        if (!targetModule) {
          statusEl.textContent = "Pick a Topic first.";
          statusEl.className = "edit-details-status err";
          return;
        }
        const reporter = overlay.querySelector("#fwdReporter").value.trim();
        if (!reporter) {
          statusEl.textContent = "Reporter / PIC is required.";
          statusEl.className = "edit-details-status err";
          return;
        }
        const fields = targetModule.fields
          .filter((f) => !f.showIf || fieldEls[f.key].wrap.style.display !== "none")
          .map((f) => ({ key: f.key, label: f.label, value: (fieldEls[f.key].control.value || "").trim() }));
        const missingRequired = targetModule.fields.find((f) =>
          f.required && (!f.showIf || fieldEls[f.key].wrap.style.display !== "none") && !fieldEls[f.key].control.value.trim()
        );
        if (missingRequired) {
          statusEl.textContent = `"${missingRequired.label}" is required.`;
          statusEl.className = "edit-details-status err";
          return;
        }
        const fieldMap = Object.fromEntries(fields.map((f) => [f.key, f.value]));

        const submitBtn = overlay.querySelector("#forwardSubmit");
        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";
        statusEl.textContent = "";
        statusEl.className = "edit-details-status";

        let newAttachments = [];
        try {
          newAttachments = await Promise.all(newFiles.map(async (f) => ({ name: f.name, type: f.type, dataUrl: await fileToDataUrl(f) })));
        } catch {
          statusEl.textContent = "Couldn't read one of the attached files — try removing and re-adding it.";
          statusEl.className = "edit-details-status err";
          submitBtn.disabled = false;
          submitBtn.textContent = "Generate & Send";
          return;
        }

        const res = await authFetch("/api/forward", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sourceThreadId: source.id, targetModule: targetModule.id, fields, fieldMap, reporter, newAttachments }),
        }).then((r) => r.json());

        if (!res.ok) {
          // Routed through the unified toast, not just the inline
          // statusEl — this action (Forward) was the one save/action
          // flow on this page still missing the shared toast entirely.
          // See feedback-toast-system-design.md §6 (Forward is one of
          // the standard action types) and §4 (funnel ok/err through
          // one place rather than leaving it inline-only).
          statusEl.textContent = "";
          statusEl.className = "edit-details-status";
          if (window.showToast) window.showToast(res.error || "Forward failed.", "err");
          submitBtn.disabled = false;
          submitBtn.textContent = "Generate & Send";
          return;
        }

        // Patch the SOURCE thread locally too — it just gained a
        // "Forwarded to" backlink server-side (addForwardedToLink()),
        // and if this modal's still-open source thread isn't refreshed,
        // that new reference card wouldn't show up until a later poll.
        selectedThread.forwardedTo = [...(selectedThread.forwardedTo || []), {
          threadId: res.thread.id, module: targetModule.id, moduleName: targetModule.name, title: res.thread.title, at: new Date().toISOString(),
        }];
        updateThreadContent(selectedThread);
        patchLocalThread(selectedThread);
        loadList();
        close();
        openThread(res.thread.id); // jump straight to the new ticket
        if (window.showToast) window.showToast("Forward success.", "ok");
      });
    }

    async function recallRoot() {
      if (!confirm("Recall the original ticket message from Telegram? This removes it from the group. Your tracking record, the Sheet row, and this conversation stay.")) return;
      const res = await postAction({ action: "recallRoot" });
      if (!res.ok) {
        if (window.showToast) window.showToast(res.error || "Recall failed.", "err");
        else alert(res.error || "Recall failed.");
        return;
      }
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
      patchLocalThread(selectedThread);
      loadList();
      if (window.showToast) window.showToast("Recall success.", "ok");
    }

    async function editReply(messageId, currentText) {
      const newText = prompt("Edit this reply:", currentText || "");
      if (newText === null) return;
      // Input validation, not an action result — stays a plain alert()
      // rather than the unified toast (see toast design doc §7 exception 1).
      if (!newText.trim()) return alert("Text can't be empty.");
      const res = await postAction({ action: "editReply", messageId: Number(messageId), text: newText });
      if (!res.ok) {
        if (window.showToast) window.showToast(res.error || "Edit failed.", "err");
        else alert(res.error || "Edit failed.");
        return;
      }
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
      if (window.showToast) window.showToast("Edit success.", "ok");
    }

    async function recallReply(messageId) {
      if (!confirm("Recall this reply from Telegram?")) return;
      const res = await postAction({ action: "recallReply", messageId: Number(messageId) });
      if (!res.ok) {
        if (window.showToast) window.showToast(res.error || "Recall failed.", "err");
        else alert(res.error || "Recall failed.");
        return;
      }
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
      if (window.showToast) window.showToast("Recall success.", "ok");
    }

    async function postAction(payload) {
      const res = await authFetch(`/api/threads/${selectedThread.id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      return res.json();
    }


    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ---- Attachment lightbox ----
    const attachLightbox = document.getElementById("attachLightbox");
    const attachLightboxBody = document.getElementById("attachLightboxBody");

    // ---- Shared attachment cache ----
    //
    // Images/videos now load AUTOMATICALLY the moment a thread opens
    // (inline in the summary card + each reply bubble) rather than
    // needing a click first. But the thread view re-renders from
    // scratch on every 6-second poll (see updateThreadContent()) — no
    // caching would mean re-fetching every visible attachment from
    // Telegram every single poll, which is slow and pointless (nothing
    // about an already-loaded attachment ever changes). This Map caches
    // by fileId, storing the in-flight/completed Promise itself (not
    // just the result) so two nearly-simultaneous requests for the same
    // fileId (e.g. the inline slot AND a lightbox click both wanting it
    // at once) share one fetch instead of firing two.
    const attachmentCache = new Map(); // fileId -> Promise<{url, type}>

    function getAttachmentUrl(fileId, name) {
      if (!attachmentCache.has(fileId)) {
        attachmentCache.set(fileId, (async () => {
          const qs = name ? `?name=${encodeURIComponent(name)}` : "";
          const res = await authFetch(`/api/attachment/${encodeURIComponent(fileId)}${qs}`);
          if (!res.ok) {
            const msg = await res.text().catch(() => "");
            throw new Error(msg || "Couldn't load this attachment.");
          }
          const blob = await res.blob();
          return { url: URL.createObjectURL(blob), type: blob.type || "" };
        })());
      }
      return attachmentCache.get(fileId);
    }

    // Fills every not-yet-loaded ".inline-attach-slot" on the page (the
    // summary card's ticket attachments + each reply's inline
    // attachment) with the real image/video, using the cache above so
    // repeat calls (every poll) skip anything already loaded. Called at
    // the end of updateThreadContent() — see that function.
    function loadInlineAttachments() {
      document.querySelectorAll(".inline-attach-slot[data-attachment-file]:not([data-filled])").forEach((slot) => {
        const fileId = slot.dataset.attachmentFile;
        const name = slot.dataset.attachmentName || "attachment";
        slot.setAttribute("data-filled", "1"); // mark now so a poll landing mid-fetch doesn't double-trigger
        getAttachmentUrl(fileId, name).then(({ url, type }) => {
          if (!document.body.contains(slot)) return; // a newer poll already replaced this DOM before we resolved
          if (type.startsWith("image/")) {
            slot.innerHTML = `<img src="${url}" alt="${escapeAttr(name)}" class="inline-attach-media" />`;
          } else if (type.startsWith("video/")) {
            slot.innerHTML = `<video src="${url}" controls class="inline-attach-media"></video>`;
          } else {
            slot.innerHTML = `<a href="${url}" download="${escapeAttr(name)}" class="inline-attach-file">📎 ${escapeHtml(name)} — click to download</a>`;
          }
          // Clicking an inline image/video also opens the fullscreen
          // lightbox, for a closer look — small bonus on top of what
          // was actually asked for, reuses the cache so it's instant.
          const media = slot.querySelector("img.inline-attach-media, video.inline-attach-media");
          if (media) media.addEventListener("click", () => viewAttachment(fileId, name));
        }).catch((err) => {
          if (!document.body.contains(slot)) return;
          slot.innerHTML = `<div class="inline-attach-error">⚠️ Couldn't load this attachment.</div>`;
        });
      });
    }

    async function viewAttachment(fileId, name) {
      attachLightbox.classList.add("is-open");
      attachLightboxBody.innerHTML = `<div class="attach-lightbox-status">Loading…</div>`;
      try {
        const { url, type } = await getAttachmentUrl(fileId, name);
        if (type.startsWith("image/")) {
          attachLightboxBody.innerHTML = `<img src="${url}" alt="${escapeAttr(name || "attachment")}" />`;
        } else if (type.startsWith("video/")) {
          attachLightboxBody.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
        } else {
          // Not an image or video (PDF/doc/etc.) — hand it off as a
          // normal download instead of pretending we can preview it
          // inline.
          const a = document.createElement("a");
          a.href = url;
          a.download = name || "attachment";
          document.body.appendChild(a);
          a.click();
          a.remove();
          attachLightboxBody.innerHTML = `<div class="attach-lightbox-status">Downloaded — this file type can't be previewed here.</div>`;
        }
      } catch (e) {
        attachLightboxBody.innerHTML = `<div class="attach-lightbox-status attach-lightbox-error">${escapeHtml(String((e && e.message) || "Couldn't load this attachment."))}</div>`;
      }
    }

    function closeAttachLightbox() {
      attachLightbox.classList.remove("is-open");
      attachLightboxBody.innerHTML = "";
      // NOTE: deliberately NOT revoking the object URL here anymore —
      // it's now a shared cache entry (see attachmentCache above) that
      // an inline thumbnail elsewhere on the page may still be using,
      // not something exclusively owned by the lightbox. Object URLs
      // get cleaned up by the browser when the page/tab itself closes.
    }
    document.getElementById("attachLightboxClose").addEventListener("click", closeAttachLightbox);
    attachLightbox.addEventListener("click", (e) => { if (e.target === attachLightbox) closeAttachLightbox(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && attachLightbox.classList.contains("is-open")) closeAttachLightbox(); });

    // Paste-anywhere, like Telegram desktop: copy a screenshot and just
    // Ctrl+V / ⌘V while a thread is open — no need to click into the
    // reply box first. Scoped with guards instead of to one element:
    //   - no thread open → nothing to attach it to, let it fall through
    //   - an edit/forward modal is open → that modal has its own scoped
    //     paste handling (see pasteHandler in openForwardModal), let it
    //     own the paste instead of double-queuing onto the reply below
    //   - the attachment lightbox is open → the person is VIEWING an
    //     existing attachment, not composing a new reply
    // Only acts when the clipboard actually contains a file — a normal
    // text paste (kind "string") always falls through untouched,
    // wherever on the page it happens.
    document.addEventListener("paste", (e) => {
      if (!selectedThread) return;
      if (document.querySelector(".edit-details-overlay")) return;
      if (attachLightbox.classList.contains("is-open")) return;
      const items = Array.from(e.clipboardData?.items || []);
      const files = items.filter((it) => it.kind === "file").map((it) => it.getAsFile()).filter(Boolean);
      if (!files.length) return;
      e.preventDefault();
      // Clipboard screenshots often come through with a generic name
      // like "image.png" with no useful info — good enough as-is, but
      // give it a timestamp so multiple pastes don't look identical in
      // the chip row.
      const named = files.map((f, i) => (f.name && f.name !== "image.png") ? f : new File([f], `pasted-${Date.now()}-${i}.${(f.type.split("/")[1] || "png")}`, { type: f.type }));
      queueAttachments(named);
      // Land focus in the reply box so the caption is easy to type right
      // after pasting, same as if the person had clicked 🔗 first.
      document.getElementById("replyInput")?.focus();
    });

    // Maintenance/Coming-soon toggle — catches a direct/bookmarked visit
    // to this page while a SuperAdmin/Owner has switched it off. Real
    // enforcement is server-side in functions/api/threads.js.
    authFetch("/api/feature-status").then((r) => r.json()).then((data) => {
      const item = data.ok && data.items["tg_reply_threads"];
      if (item && item.blocked) {
        document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#e5e7eb;font-family:system-ui;font-size:15px;text-align:center;padding:24px;">${
          item.status === "coming_soon"
            ? "🔜 Not available yet, please check back later."
            : "⚠️ Under maintenance, please try again later."
        }</div>`;
        return;
      }
      bootDashboard();
    }).catch(() => bootDashboard()); // Non-fatal — server still enforces the real block.

    // Browsers throttle background-tab timers, so a poll can lag while the
    // tab is hidden (e.g. agent switches to the Telegram app/tab). Catch up
    // immediately the moment this tab becomes visible again. (Idle-timeout
    // checking itself is authguard.js's job, not this page's.)
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadList(document.getElementById("threadSearch").value);
        refreshOpenThread();
      }
    });
  </script>
