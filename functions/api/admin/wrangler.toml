name = "telegram-issue-hub"
pages_build_output_dir = "public"

# IMPORTANT — Build command: functions/ now depends on @cf-wasm/photon
# (see functions/_shared/telegramImageCompress.js), so Cloudflare Pages
# MUST run `npm install` before esbuild bundles the Functions, or the
# build fails with "Cannot find module '@cf-wasm/photon'". There is no
# valid `[build]` key in a Pages project's wrangler.toml (that's a
# Workers-only concept — Pages ignores it if you add one) — this has to
# be set in the dashboard instead: Workers & Pages → this project →
# Settings → Builds & deployments → Build command → `npm install`
# (Build output directory stays `public`, unchanged). See README.md.

[[r2_buckets]]
binding = "SCREENSHOTS_BUCKET"
bucket_name = "inr-issuescreenshot"

# TG Reply Threads feature — bound to the "inr-ticket-threads" KV namespace.
[[kv_namespaces]]
binding = "THREADS_KV"
id = "4821238464004b8289e4ded5a467d582"

# TG Reply Threads feature — D1 database for per-thread message storage
# (replaces KV for the hot read/write path; KV stays for the sidebar list cache).
[[d1_databases]]
binding = "THREADS_DB"
database_name = "inr-ticket-threads"
database_id = "1327b88e-ceda-405d-94ff-8a7ea7da269d"

[vars]
# Non-secret local defaults for `wrangler pages dev`. Real deployments set
# TELEGRAM_BOT_TOKEN as an encrypted secret in the Cloudflare dashboard —
# do NOT put the real token here or commit it.
